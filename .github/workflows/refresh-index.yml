name: Refresh BBC index

on:
  schedule:
    # Every 3 hours. GitHub Pages serves docs/cache.json as committed here.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Crawl BBC RSS feeds and rebuild the static index
        run: python3 scripts/build_static_index.py

      - name: Commit updated index if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/cache.json
          git diff --cached --quiet || git commit -m "Auto-refresh BBC word index"
          git push
