<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BBC Word Finder</title>

  <!-- Make "Add to Home Screen" on iOS behave like a real standalone app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Word Finder">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111111">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <h1>BBC Word Finder</h1>
    <p class="tagline">Hear a word used, again and again, in real BBC sentences.</p>
  </header>

  <main>
    <form id="search-form" class="search-row" autocomplete="off">
      <input id="word-input" type="text" placeholder="Type a word&hellip; e.g. resilient" spellcheck="false">
      <button type="submit">Search</button>
    </form>

    <div id="index-status" class="index-status"></div>

    <section id="empty-state" class="empty-state">
      <p>Search a word to see it used across current BBC articles.</p>
    </section>

    <section id="no-results" class="empty-state" hidden>
      <p>No matches found in the current index.</p>
      <p class="hint">Try refreshing the index, or try a different word / word form.</p>
    </section>

    <section id="stage" class="stage" hidden>
      <div class="player-col">
        <div class="player">
          <div class="player-sentence-wrap">
            <p id="player-sentence" class="player-sentence"></p>
          </div>
          <div class="player-source">
            <a id="player-link" href="#" target="_blank" rel="noopener"></a>
            <span id="player-feed" class="feed-tag"></span>
          </div>

          <div class="transport">
            <button id="btn-prev" type="button" class="icon-btn" aria-label="Previous" title="Previous">&#9664;&#9664;</button>
            <button id="btn-replay" type="button" class="icon-btn" aria-label="Replay" title="Replay">&#8635;</button>
            <button id="btn-play" type="button" class="icon-btn play-btn" aria-label="Play">&#9654;</button>
            <button id="btn-next" type="button" class="icon-btn" aria-label="Next" title="Next">&#9654;&#9654;</button>
            <span id="player-counter" class="counter"></span>
          </div>

          <div class="settings-row">
            <label class="setting">
              <input id="autoplay-toggle" type="checkbox">
              Auto-advance
            </label>
            <label class="setting">
              Accent
              <select id="voice-select"></select>
            </label>
            <label class="setting">
              Speed
              <select id="speed-select">
                <option value="0.75">0.75&times;</option>
                <option value="1" selected>1&times;</option>
                <option value="1.25">1.25&times;</option>
                <option value="1.5">1.5&times;</option>
              </select>
            </label>
          </div>
        </div>
      </div>

      <aside class="queue-col">
        <div class="queue-heading">All examples</div>
        <ol id="result-list" class="result-list"></ol>
      </aside>
    </section>
  </main>

  <footer>
    <button id="btn-refresh" type="button">Refresh index</button>
    <span id="refresh-msg"></span>
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
